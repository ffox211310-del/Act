<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パーソナルAIモード</title>

  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
  {
    "imports": {
      "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm@0.2.79"
    }
  }
  </script>
</head>

<body>

<div class="stars" id="stars"></div>

  <!-- 初回案内 -->
<div class="intro-overlay" id="introOverlay">

  <div class="intro-card">

    <!-- ちょこんとしたアイツ -->
    <div class="intro-bot">
      <div class="intro-halo"></div>
      <div class="intro-face">
        <div class="intro-eyes">
          <div class="intro-eye"></div>
          <div class="intro-eye"></div>
        </div>
      </div>
    </div>

    <h1>パーソナルモードについて</h1>

    <div class="intro-text">

      <p>
        • あなた専用のAIです。どこにも情報は流れません。
      </p>

      <p>
        • モードは「大・中・小」から選べます。<br>
        あなたの端末に合わせて調整してください。<br>
        （標準では「中」に設定されています。）
      </p>

      <p>
        • 終了するときは必ず「今日はおやすみ」と告げてください。<br>
        AIが自動で今日のことを記憶します。<br>
        （記憶後は通常モードに戻ります。）
      </p>

      <p class="intro-note">
        ※ 使用されるAI：大・中・小すべてQwenのInstructモデルです。
      </p>

    </div>

    <button id="introStart">
      はじめる
    </button>

  </div>

</div>
  
<div class="bot" id="bot">
  <div class="halo"></div>

  <div class="face">
    <div class="eyes">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
  </div>
</div>

<div class="bubble" id="bubble"></div>

<div class="composer">
  <input
    id="input"
    type="text"
    placeholder="今日はどんな一日だった？"
    autocomplete="off"
    disabled
  >
</div>

<script type="module" src="./app.js"></script>

</body>
</html>
