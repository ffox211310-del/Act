<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Teal</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    place-items: center;
    background: #000;
  }
  .stage { width: min(90vmin, 520px); height: min(90vmin, 520px); }
  .stage svg { width: 100%; height: 100%; overflow: visible; }

  /* ===== キャラ全体：ふわふわ浮く ===== */
  .teal {
    animation: tealFloat 3.8s ease-in-out infinite;
    transform-origin: 200px 250px;
  }
  @keyframes tealFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }

  /* ===== 目：瞬き ===== */
  .eye {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    transition: transform 0.1s ease;
  }
  .eye.blink { transform: scaleY(0.08); }

  /* ===== 口：喋ってる風 ===== */
  .mouth {
    transform-box: fill-box;
    transform-origin: 50% 0%;       /* 上辺を軸に下へ開く */
  }
  .teal.speaking .mouth {
    animation: talk 0.32s ease-in-out infinite alternate;
  }
  @keyframes talk {
    from { transform: scaleY(1);   }
    to   { transform: scaleY(2.4); }
  }

  /* 喋ってる時の目も微かに動く */
  .teal.speaking .eye {
    animation: eyeTalk 0.5s ease-in-out infinite alternate;
  }
  .teal.speaking .eye.right { animation-delay: 0.25s; }
  @keyframes eyeTalk {
    from { transform: scaleY(0.72); }
    to   { transform: scaleY(1.05); }
  }

  /* ===== 手：ゆらゆら ===== */
  .hand {
    transform-box: fill-box;
  }
  .hand.left {
    transform-origin: 85% 30%;       /* 体側の付け根 */
    animation: swayL 2.9s ease-in-out infinite;
  }
  .hand.right {
    transform-origin: 15% 30%;
    animation: swayR 3.3s ease-in-out infinite;
  }
  @keyframes swayL {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(5deg);  }
  }
  @keyframes swayR {
    0%, 100% { transform: rotate(7deg);  }
    50%      { transform: rotate(-5deg); }
  }

  /* ===== ぴょこっ（隠れて出てくる） ===== */
  .teal.peekaboo {
    animation: peekaboo 1.4s cubic-bezier(.4, 0, .3, 1);
  }
  @keyframes peekaboo {
    0%   { transform: translateY(0);    }
    25%  { transform: translateY(55px); }   /* 隠れる */
    55%  { transform: translateY(55px); }   /* 間 */
    80%  { transform: translateY(-6px); }   /* 出てくる */
    100% { transform: translateY(0);    }
  }
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

  <!-- ============ 1. 地球（背景） ============ -->
  <g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round">
    <circle cx="200" cy="200" r="158"/>
    <!-- 上の斜め線 -->
    <path d="M 55 155 Q 200 105 345 140"/>
    <!-- 中ほどの横線（カーテンの上側） -->
    <path d="M 45 240 Q 200 215 355 240"/>
    <!-- 下の横線 -->
    <path d="M 75 310 Q 200 288 325 310"/>
    <!-- 左の縦カーブ -->
    <path d="M 190 45 Q 100 200 190 355"/>
    <!-- 中の縦カーブ -->
    <path d="M 200 42 Q 222 200 200 358"/>
    <!-- 右の縦カーブ -->
    <path d="M 212 46 Q 300 200 208 355"/>
  </g>

  <!-- ============ 2. Teal（キャラ） ============ -->
  <g class="teal" id="teal">

    <!-- 左手 -->
    <g class="hand left">
      <ellipse cx="82" cy="228" rx="30" ry="48" fill="#4FD1C5"
               transform="rotate(-25 82 228)"/>
      <!-- 手のテカリ -->
      <path d="M 74 215 Q 68 232 71 250"
            stroke="#fff" stroke-width="4.5" stroke-linecap="round"
            fill="none" opacity="0.85"
            transform="rotate(-25 82 228)"/>
    </g>

    <!-- 右手 -->
    <g class="hand right">
      <ellipse cx="320" cy="205" rx="30" ry="48" fill="#4FD1C5"
               transform="rotate(25 320 205)"/>
      <!-- 手のテカリ -->
      <path d="M 330 192 Q 336 208 333 224"
            stroke="#fff" stroke-width="4.5" stroke-linecap="round"
            fill="none" opacity="0.85"
            transform="rotate(25 320 205)"/>
    </g>

    <!-- 胴体（頭） -->
    <ellipse cx="200" cy="205" rx="96" ry="82" fill="#4FD1C5"/>

    <!-- 頭のテカリ -->
    <path d="M 240 145 Q 258 152 264 172"
          stroke="#fff" stroke-width="5.5" stroke-linecap="round"
          fill="none" opacity="0.9"/>
    <path d="M 252 178 Q 258 182 261 189"
          stroke="#fff" stroke-width="4" stroke-linecap="round"
          fill="none" opacity="0.6"/>

    <!-- 目 -->
    <rect class="eye left"  x="170" y="182" width="14" height="34" rx="7" fill="#fff"/>
    <rect class="eye right" x="216" y="182" width="14" height="34" rx="7" fill="#fff"/>

    <!-- 口（三角） -->
    <polygon class="mouth" points="200,228 191,240 209,240" fill="#fff"/>

  </g>

  <!-- ============ 3. カーテン（白い横棒） ============ -->
  <rect x="40" y="243" width="320" height="22" fill="#fff" rx="3"/>

</svg>
</div>

<script>
(function () {
  const teal = document.getElementById('teal');
  const eyes = document.querySelectorAll('.eye');

  /* ---------- 瞬き ---------- */
  function blink() {
    if (teal.classList.contains('speaking')) return;
    eyes.forEach(e => e.classList.add('blink'));
    setTimeout(() => eyes.forEach(e => e.classList.remove('blink')), 120);
  }
  (function blinkLoop() {
    setTimeout(() => {
      blink();
      if (Math.random() < 0.25) setTimeout(blink, 240);
      blinkLoop();
    }, 1800 + Math.random() * 2800);
  })();

  /* ---------- 喋ってる風 ---------- */
  let speakTimer = null;
  window.tealSpeak = function (ms = 2000) {
    teal.classList.add('speaking');
    clearTimeout(speakTimer);
    speakTimer = setTimeout(() => teal.classList.remove('speaking'), ms);
  };

  /* ---------- ぴょこっ（隠れて出てくる） ---------- */
  function peekaboo() {
    teal.classList.remove('peekaboo');
    void teal.offsetWidth;              // アニメ再開のおまじない
    teal.classList.add('peekaboo');
    setTimeout(() => teal.classList.remove('peekaboo'), 1400);
  }

  /* ---------- クリック：隠れて出てきて喋る ---------- */
  document.addEventListener('click', () => {
    peekaboo();
    setTimeout(() => window.tealSpeak(2200), 1100);  // 出てきたあとに喋る
  });

})();
</script>
</body>
</html>
