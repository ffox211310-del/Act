<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIキャラ</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    display: grid;
    place-items: center;
    background: #fff;          /* 背景は白 */
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ===== キャラ本体（ふわふわ浮く） ===== */
  .bot {
    position: relative;
    width: 260px;
    height: 260px;
    cursor: pointer;
    animation: float 4.6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(6px); }
    50%      { transform: translateY(-10px); }
  }

  /* ===== 後光 ===== */
  .halo {
    position: absolute;
    inset: -55px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(79,209,197,.45) 0%, rgba(79,209,197,0) 68%);
    pointer-events: none;
    animation: halo 4.6s ease-in-out infinite;
  }
  @keyframes halo {
    0%, 100% { transform: scale(.9);  opacity: .55; }
    50%      { transform: scale(1.06); opacity: 1; }
  }

  /* ===== 顔（球体） ===== */
  .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 26%, #7ee6db 0%, #4FD1C5 46%, #37b8ab 100%);
    box-shadow:
      0 24px 50px -18px rgba(79,209,197,.9),
      0 8px 20px -8px rgba(79,209,197,.55),
      inset 0 -16px 30px -14px rgba(0,90,84,.45),
      inset 0 12px 24px -12px rgba(255,255,255,.7);
    transform: rotate(var(--tilt, 0deg));
    will-change: transform;
  }

  /* ===== 目（白い2本のバー） ===== */
  .eyes {
    position: absolute;
    left: 50%;
    top: 44%;
    display: flex;
    gap: 20px;
    transform: translate(-50%, -50%) translate(var(--ex, 0px), var(--ey, 0px));
    will-change: transform;
  }

  .eye {
    width: 28px;
    height: 92px;
    border-radius: 999px;
    background: #fff;
    transform-origin: 50% 50%;
    transition: transform .1s cubic-bezier(.4, 0, .2, 1);
    box-shadow: 0 0 18px rgba(255,255,255,.6);
  }

  /* 瞬き：縦に潰す */
  .eye.blink { transform: scaleY(.09); }

  /* クリック時：びっくりして縮む */
  .eye.pop   { transform: scaleY(.42) scaleX(1.18); }

  /* 喋ってる風：バーが伸び縮み */
  .bot.speaking .eye {
    animation: talk .46s ease-in-out infinite alternate;
  }
  .bot.speaking .eye:nth-child(2) { animation-delay: .23s; }
  @keyframes talk {
    from { transform: scaleY(.66); }
    to   { transform: scaleY(1.08); }
  }

  /* ===== 波紋 ===== */
  .ripple {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(79,209,197,.85);
    opacity: 0;
    pointer-events: none;
  }
  .ripple.go { animation: ripple .9s cubic-bezier(.2,.7,.3,1); }
  @keyframes ripple {
    0%   { transform: scale(1);    opacity: .8; }
    100% { transform: scale(1.75); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="bot">
    <div class="halo"></div>

    <div class="face">
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="ripple"></div>
    </div>
  </div>

<script>
(function () {
  const root   = document.documentElement;
  const bot    = document.querySelector('.bot');
  const faceEl = document.querySelector('.face');
  const eyeEls = document.querySelectorAll('.eye');
  const ripple = document.querySelector('.ripple');

  /* ---------- 1. 瞬き ---------- */
  function blink() {
    if (bot.classList.contains('speaking')) return;   // 喋ってる間は瞬きしない
    eyeEls.forEach(el => el.classList.add('blink'));
    setTimeout(() => eyeEls.forEach(el => el.classList.remove('blink')), 110);
  }

  (function blinkLoop() {
    const wait = 1500 + Math.random() * 2800;         // 1.5〜4.3秒のランダム間隔
    setTimeout(() => {
      blink();
      if (Math.random() < 0.25) setTimeout(blink, 240); // たまに2連続
      blinkLoop();
    }, wait);
  })();

  /* ---------- 2. 視線（目がカーソルを追う） ---------- */
  let tx = 0, ty = 0;   // 目標
  let cx = 0, cy = 0;   // 現在
  let lastMove = -1e9;

  function lookAt(px, py) {
    const r  = faceEl.getBoundingClientRect();
    const ox = px - (r.left + r.width / 2);
    const oy = py - (r.top + r.height / 2);
    const d  = Math.hypot(ox, oy) || 1;
    const reach = Math.min(d / 320, 1);               // 遠いほど大きく動く
    tx = (ox / d) * 15 * reach;
    ty = (oy / d) * 11 * reach;
  }

  window.addEventListener('mousemove', e => {
    lastMove = performance.now();
    lookAt(e.clientX, e.clientY);
  });

  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (!t) return;
    lastMove = performance.now();
    lookAt(t.clientX, t.clientY);
  }, { passive: true });

  document.addEventListener('mouseleave', () => { tx = 0; ty = 0; });

  // なめらかに補間してCSS変数へ
  (function tick() {
    cx += (tx - cx) * 0.12;
    cy += (ty - cy) * 0.12;
    root.style.setProperty('--ex', cx.toFixed(2) + 'px');
    root.style.setProperty('--ey', cy.toFixed(2) + 'px');
    root.style.setProperty('--tilt', (cx * 0.35).toFixed(2) + 'deg');  // 首をちょっとかしげる
    requestAnimationFrame(tick);
  })();

  /* ---------- 3. 放置されたらキョロキョロ ---------- */
  setInterval(() => {
    if (performance.now() - lastMove < 2500) return;
    const a = Math.random() * Math.PI * 2;
    const r = 6 + Math.random() * 9;
    tx = Math.cos(a) * r;
    ty = Math.sin(a) * r * 0.6;
  }, 2000);

  /* ---------- 4. 喋ってる風モード ---------- */
  let speakTimer = null;
  function speak(ms) {
    bot.classList.add('speaking');
    clearTimeout(speakTimer);
    speakTimer = setTimeout(() => bot.classList.remove('speaking'), ms);
  }
  // 外部から呼べるようにしておく（会話AI側と連携しやすい）
  window.aiSpeak = speak;

  /* ---------- 5. クリック／タップ反応 ---------- */
  document.addEventListener('pointerdown', e => {
    lookAt(e.clientX, e.clientY);

    // びっくりして縮む
    eyeEls.forEach(el => {
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 300);
    });

    // 波紋
    ripple.classList.remove('go');
    void ripple.offsetWidth;
    ripple.classList.add('go');

    // ちょっと遅れて喋り出す
    setTimeout(() => speak(1500), 380);
  });
})();
</script>
</body>
</html>
