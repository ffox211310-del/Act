<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teal</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0a;
    display: grid;
    place-items: center;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    width: min(85vmin, 480px);
    cursor: pointer;
  }

  /* ===== 画像全体をふわふわ ===== */
  .teal {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    animation: bob 4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3.5%); }
  }

  .teal img {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
  }

  /* ===== まぶた（同じ色で目を覆う） ===== */
  .eyelid {
    position: absolute;
    background: #4FD1C5;
    /* 下側だけ丸くして、目ん玉の形に近づける */
    border-radius: 45% 45% 50% 50% / 20% 20% 100% 100%;

    /* 上辺を軸に、縦に潰す／伸ばす */
    transform-origin: 50% 0%;
    transform: scaleY(0);                /* 普段は隠れてる */
    transition: transform 0.09s cubic-bezier(.4, 0, .2, 1);

    pointer-events: none;
    /* うっすらぼかして画像との境目を馴染ませる */
    filter: blur(0.4px);
  }
  .eyelid.blink { transform: scaleY(1); }  /* 瞬きのときだけ下りてくる */

  /* ===== 目の位置（ここだけ微調整すればOK） ===== */
  
/* 左目 */
.eyelid.left {
  left:   43.5%;   /* 横位置：そのまま */
  top:    38.5%;   /* ← 40.5% から上へ（4%アップ） */
  width:   5.5%;   /* そのまま */
  height:  9%;     /* ← 11% から短く（はみ出し解消） */
}
/* 右目 */
.eyelid.right {
  left:   53.5%;
  top:    38.5%;   /* ← 同じく上へ */
  width:   5.5%;
  height:  9%;
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="teal" id="teal">
    <img src="CronyGOicon.jpg" alt="Teal">
    <div class="eyelid left"></div>
    <div class="eyelid right"></div>
  </div>
</div>

<script>
(function () {
  const eyelids = document.querySelectorAll('.eyelid');

  function blink() {
    eyelids.forEach(e => e.classList.add('blink'));
    setTimeout(() => eyelids.forEach(e => e.classList.remove('blink')), 120);
  }

  /* 1.8〜4.8秒のランダム間隔で瞬き、たまに2連続 */
  (function loop() {
    setTimeout(() => {
      blink();
      if (Math.random() < 0.25) setTimeout(blink, 240);
      loop();
    }, 1800 + Math.random() * 3000);
  })();

  /* タップでぱちぱち */
  document.getElementById('stage').addEventListener('click', () => {
    blink();
    setTimeout(blink, 180);
  });
})();
</script>
</body>
</html>
